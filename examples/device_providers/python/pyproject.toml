[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurale-example-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyneurale"]

[project.entry-points."neurale.devices"]
"example.python" = "neurale_example_python:provider"

[tool.setuptools.packages.find]
where = ["src"]
