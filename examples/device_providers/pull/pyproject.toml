[build-system]
requires = ["scikit-build-core>=0.10", "pyneurale"]
build-backend = "scikit_build_core.build"

[project]
name = "neurale-example-pull"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyneurale"]

[project.entry-points."neurale.devices"]
"example.pull" = "neurale_example_pull:provider"

[tool.scikit-build]
wheel.packages = ["src/neurale_example_pull"]
