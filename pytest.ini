[pytest]
testpaths = tests
addopts = --require-native -ra -m "not python_only and not slow and not gpu and not interactive and not hardware"

markers =
    python_only: deliberately runs without importing native or CUDA extensions
    native: requires an installed PyNeurale native extension
    slow: marks tests as slow
    interactive: requires interactive UI or manual input
    gpu: requires CUDA/GPU support
    visualization: requires optional visualization dependencies or renders plots/windows
    hardware: requires external hardware or platform devices
    stable_backend: exercises the shipping recorder backend with nothing substituted

norecursedirs = .git .venv build dist temp

# Live logging is deliberately not enabled here. At DEBUG it made every run pay
# for its own diagnostics: one recording run emits roughly sixteen thousand
# records, almost all of them asyncio announcing a new event loop for a zarr
# call, and each one is formatted and written under the logging lock by
# whichever thread produced it -- which is the recorder's writer thread. Where a
# console write is expensive the writer starves, and a graceful stop can miss
# its join deadline and fault a session that was fine. Turn it on per run when
# you want it:
#
#   python -m pytest --log-cli-level=DEBUG tests/unit/recording
#
# Failures still carry their captured logs; only the live stream is off.
