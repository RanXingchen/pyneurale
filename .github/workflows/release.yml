name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already tagged as vVERSION
        required: true
        type: string
      publish:
        description: Upload the validated artifacts to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build four wheels and one sdist
    runs-on: [self-hosted, windows, x64, pyneurale-release]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - name: Build and validate release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: tools/build_release.ps1 -Version $env:RELEASE_VERSION
      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyneurale-${{ inputs.version }}
          path: dist/release/${{ inputs.version }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksum evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyneurale-${{ inputs.version }}-evidence
          path: temp/release-build/${{ inputs.version }}/evidence/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyneurale-${{ inputs.version }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
