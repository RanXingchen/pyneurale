name: Native sanitizers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sanitizers.yml"
      - "CMakeLists.txt"
      - "cpp/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-asan-ubsan-lsan:
    name: Linux CPU ASan, UBSan, and LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native build tooling
        run: python -m pip install --upgrade pip pybind11
      - name: Configure native sanitizer tests
        run: >-
          cmake -S . -B build/sanitizers
          -DNEURALE_BUILD_CPP_TESTS=ON
          -DNEURALE_ENABLE_MKL=OFF
          -DNEURALE_ENABLE_CUDA=OFF
          -DNEURALE_ENABLE_ASAN=ON
          -DNEURALE_ENABLE_UBSAN=ON
          -DNEURALE_ENABLE_LSAN=ON
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Compile every public header independently with GCC
        run: >-
          cmake --build build/sanitizers --config RelWithDebInfo
          --target neurale_public_header_self_containment
      - name: Build native sanitizer tests
        run: cmake --build build/sanitizers --config RelWithDebInfo
      - name: Run required sanitizer tests
        run: >-
          ctest --test-dir build/sanitizers -C RelWithDebInfo
          -R '^(neurale_streaming_|neurale_pipeline_|neurale_recording_|neurale_experiments_|neurale_execution_)'
          -LE 'allocation-full|allocation-operator-new'
          --no-tests=error --output-on-failure

  windows-msvc-asan:
    name: Windows CPU MSVC ASan
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native build tooling
        run: python -m pip install --upgrade pip pybind11
      - name: Configure native ASan tests
        run: >-
          cmake -S . -B build/asan-msvc
          -DNEURALE_BUILD_CPP_TESTS=ON
          -DNEURALE_ENABLE_MKL=OFF
          -DNEURALE_ENABLE_CUDA=OFF
          -DNEURALE_ENABLE_ASAN=ON
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Compile every public header independently with MSVC
        run: >-
          cmake --build build/asan-msvc --config RelWithDebInfo
          --target neurale_public_header_self_containment
      - name: Build native ASan tests
        run: cmake --build build/asan-msvc --config RelWithDebInfo
      - name: Run required ASan tests
        run: >-
          ctest --test-dir build/asan-msvc -C RelWithDebInfo
          -R '^(neurale_streaming_|neurale_pipeline_|neurale_recording_|neurale_experiments_|neurale_execution_)'
          -LE 'allocation-full|allocation-operator-new'
          --no-tests=error --output-on-failure
