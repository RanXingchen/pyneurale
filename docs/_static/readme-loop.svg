<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">PyNeurale closed-loop architecture</title>
  <desc id="desc">Device adapters, LSL, or simulation feed bounded native streaming, real-time processing and decoding, and experiment control. Streaming branches to NRF recording and native replay preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; }
      .eyebrow { fill: #7dd3fc; font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; }
      .node-title { fill: #f8fafc; font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node-copy { fill: #a8b7cc; font: 400 12.5px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node-copy-compact { font-size: 11.5px; }
      .branch-title { fill: #e2e8f0; font: 650 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .branch-copy { fill: #94a3b8; font: 400 11.5px Inter, ui-sans-serif, system-ui, sans-serif; }
      .arrow { fill: none; stroke: #60a5fa; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch-arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="390" rx="22" fill="url(#background)"/>
  <path d="M 0 3 H 1200" stroke="url(#accent)" stroke-width="6"/>
  <text x="50" y="48" class="eyebrow">THE PYNEURALE LOOP</text>
  <text x="50" y="79" class="title">From neural data to a replayable experiment</text>

  <g filter="url(#shadow)">
    <rect x="50" y="118" width="220" height="105" rx="14" fill="#142238" stroke="#334b68"/>
    <rect x="330" y="118" width="240" height="105" rx="14" fill="#132a40" stroke="#24749b"/>
    <rect x="630" y="118" width="220" height="105" rx="14" fill="#1b2541" stroke="#5263a8"/>
    <rect x="910" y="118" width="240" height="105" rx="14" fill="#252344" stroke="#7563b5"/>
  </g>

  <text x="72" y="151" class="node-title">Acquisition</text>
  <text x="72" y="172" class="node-copy">device adapters</text>
  <text x="72" y="190" class="node-copy">LSL</text>
  <text x="72" y="208" class="node-copy">simulation</text>

  <text x="352" y="151" class="node-title">Native streaming</text>
  <text x="352" y="177" class="node-copy">fixed pools + bounded queues</text>
  <text x="352" y="197" class="node-copy">fault handling + safety</text>

  <text x="652" y="151" class="node-title">Process + decode</text>
  <text x="652" y="177" class="node-copy">real-time processing</text>
  <text x="652" y="197" class="node-copy">online decoding</text>

  <text x="932" y="151" class="node-title">Run the experiments</text>
  <text x="932" y="185" class="node-copy node-copy-compact">Center-Out/WebGrid/Speech/SSVEP</text>

  <path d="M 270 170 H 318" class="arrow"/>
  <path d="M 570 170 H 618" class="arrow"/>
  <path d="M 850 170 H 898" class="arrow"/>

  <path d="M 450 224 V 246 H 600 V 264" class="branch-arrow"/>

  <g filter="url(#shadow)">
    <rect x="450" y="265" width="300" height="82" rx="13" fill="#111e31" stroke="#365471"/>
  </g>

  <text x="472" y="297" class="branch-title">Record → NRF → inspect</text>
  <text x="472" y="321" class="branch-copy">recover • prepare native replay</text>

  <circle cx="50" cy="365" r="3" fill="#38bdf8"/>
  <text x="62" y="369" class="branch-copy">IDs, timestamps, data gaps, and task state stay clear from start to finish.</text>
</svg>
